<style>
/* Layout: work tool on bone paper. Ink rail on the left (bottom tabs on phones), one working surface, sheets slide in for editing. */
:root {
  --bone: #EDE8DF; --dust: #D9D2C5; --paper: #F7F4EE; --ink: #121110; --graphite: #5E584F; --signal: #FF3B1F; --signal-ink: #C42A12;

/* ---------- login ---------- */

/* ---------- shell ---------- */
